apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'
// 确保删除了过时的 apply plugin: 'kotlin-android-extensions'

android {
    // 现代编译器强制要求的编译 SDK 版本
    namespace "com.tencent.qgame.animplayer"
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    // 1. 显式配置 Java 编译器的目标版本为 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 2. 显式配置 Kotlin 编译器的目标版本为 17
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

//    repositories {
//        flatDir {
//            dirs 'libs'
//        }
//    }

//    sourceSets {
//        main {
//            // 如果你把 .so 文件放在了 libs 目录下，必须这样指明
//            jniLibs.srcDirs = ['libs']
//        }
//    }
}

dependencies {
    // 现代标准写法，去除过时的 jdk7 后缀
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // ffmpeg-lite 只在 ndk-build 时提供预编译 .so，产物已经打进 animplayer.aar。
    // 不要声明成 Maven 依赖：JitPack 会扫描 local-maven 里的 pom，把坐标改写成
    // com.github.theboundaryforever.vap2:ffmpeg-lite，但不会发布这个模块。
    if (file('libs').directory) {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
    }
}

// JitPack clones the git repo only. local-maven-tmp is gitignored, so extract
// the committed AAR instead of requiring a pre-unpacked jni directory.
def ffmpegLiteAar = rootProject.file("local-maven/com/tencent/qgame/ffmpeg-lite/1.0.0/ffmpeg-lite-1.0.0.aar")

def prepareFfmpegLiteNative = tasks.register("prepareFfmpegLiteNative") {
    def prefixDir = rootProject.file(".ffmpeg-lite-build/prefix")
    def includeDir = file("src/main/jni/ffmpeg-include")
    def extractRoot = rootProject.file("local-maven-tmp/ffmpeg-lite")
    def jniLibsDir = new File(extractRoot, "jni")
    inputs.file(ffmpegLiteAar)
    inputs.dir(includeDir)
    outputs.dir(prefixDir)
    outputs.dir(jniLibsDir)
    doLast {
        if (!ffmpegLiteAar.isFile()) {
            throw new GradleException("Missing ffmpeg-lite AAR: ${ffmpegLiteAar}")
        }
        extractRoot.deleteDir()
        copy {
            from(zipTree(ffmpegLiteAar))
            include "jni/**/*.so"
            into(extractRoot)
        }
        ["arm64-v8a", "armeabi-v7a"].each { abi ->
            def abiLibs = new File(jniLibsDir, abi)
            if (!abiLibs.directory || abiLibs.listFiles()?.length == 0) {
                throw new GradleException("ffmpeg-lite AAR has no native libs for ${abi}: ${ffmpegLiteAar}")
            }
            copy {
                from(abiLibs)
                include "*.so"
                into("${prefixDir}/${abi}/lib")
            }
            copy {
                from(includeDir)
                into("${prefixDir}/${abi}/include")
            }
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'animplayer'
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("configureNdkBuild") || task.name.startsWith("buildNdkBuild")) {
        task.dependsOn prepareFfmpegLiteNative
    }
}